<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Éter Ambient</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #ffffff;
    }

    body {
      overflow-x: hidden;
    }

    /* PORTADA */

    .hero {
      width: 100%;
      height: 100svh;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 40px 24px;
    }

    .hero-logo {
      width: min(58vw, 620px);
      height: auto;
      display: block;
    }

    .hero-name {
      width: min(35vw, 370px);
      height: auto;
      display: block;

      margin-top: 35px;
    }

    /* ENTRADA SUAVE */

    .hero-logo,
    .hero-name {
      opacity: 0;
      transform: translateY(8px);
      animation: aparecer 1.5s ease forwards;
    }

    .hero-name {
      animation-delay: 0.25s;
    }

    @keyframes aparecer {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* MOBILE */

    @media (max-width: 700px) {

      .hero {
        padding: 30px 20px;
      }

      .hero-logo {
        width: 88vw;
      }

      .hero-name {
        width: 60vw;
        margin-top: 25px;
      }

    }
  </style>
</head>

<body>

  <main>

    <section class="hero">

      <img
        class="hero-logo"
        src="https://res.cloudinary.com/dsppfoxzs/image/upload/v1789863156/ChatGPT_Image_Sep_19_2026_09_08_56_PM_jxjwks.png"
        alt="Éter Ambient"
      >

      <img
        class="hero-name"
        src="https://res.cloudinary.com/dsppfoxzs/image/upload/v1789863161/ChatGPT_Image_Sep_19_2026_09_09_08_PM_g4iggm.png"
        alt="Éter Ambient"
      >

    </section>

  </main>

</body>
</html>
