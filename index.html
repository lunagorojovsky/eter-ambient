<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Éter Ambient</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #111111;
    }

    /* PORTADA */

    .hero {
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .hero h1 {
      font-size: clamp(3rem, 9vw, 8rem);
      font-weight: 400;
      letter-spacing: -0.04em;
    }

    /* CONTENIDO */

    section {
      min-height: 100vh;
      padding: 10vw;
      display: flex;
      align-items: center;
    }

    .content {
      max-width: 800px;
    }

    h2 {
      font-size: clamp(2rem, 5vw, 5rem);
      font-weight: 400;
      margin-bottom: 30px;
    }

    p {
      font-size: clamp(1rem, 1.5vw, 1.3rem);
      line-height: 1.6;
    }

    /* CONTACTO */

    .contacto {
      min-height: 70vh;
    }

    a {
      color: inherit;
    }

  </style>
</head>

<body>

  <main>

    <section class="hero">
      <h1>ÉTER AMBIENT</h1>
    </section>

    <section id="eter">
      <div class="content">
        <h2>Éter</h2>
        <p>
          Un espacio dedicado al sonido, la vibración y la escucha.
        </p>
      </div>
    </section>

    <section id="sonoterapia">
      <div class="content">
        <h2>Sonoterapia</h2>
        <p>
          Experiencias sonoras individuales y grupales.
        </p>
      </div>
    </section>

    <section id="espacio">
      <div class="content">
        <h2>El espacio</h2>
        <p>
          Éter Ambient.
        </p>
      </div>
    </section>

    <section id="contacto" class="contacto">
      <div class="content">
        <h2>Contacto</h2>
        <p>
          Próximamente.
        </p>
      </div>
    </section>

  </main>

</body>
</html>
